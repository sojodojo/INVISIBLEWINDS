<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INVISIBLE WINDS</title>
<script src="vendor/page-flip.browser.js"></script>
<script src="pages.js"></script>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: transparent;
    font-family: system-ui, "Segoe UI", sans-serif;
    overflow: hidden;
  }
  #stage {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  #bookHolder {
    flex: 1 1 auto;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 0;
  }
  .sheet { background: #fff; overflow: hidden; }
  .sheet svg { width: 100%; height: 100%; display: block; }
  .sheet.--cover { background: #f4f0e8; }

  #bar {
    flex: 0 0 auto;
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 10px 0 12px;
    user-select: none;
  }
  #bar button {
    background: rgba(60,60,66,.85);
    color: #f0f0f2;
    border: 0;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 14px;
    cursor: pointer;
  }
  #bar button:hover { background: rgba(85,85,94,.95); }
  #num { color: #8a8a92; font-size: 13px; min-width: 64px; text-align: center; }
</style>
</head>
<body>
<div id="stage">
  <div id="bookHolder"><div id="book"></div></div>
  <div id="bar">
    <button id="prev" aria-label="Previous page">‹</button>
    <span id="num"></span>
    <button id="next" aria-label="Next page">›</button>
  </div>
</div>

<script>
const ASPECT = 0.98439;          // single page w/h (8.5 x 8.5 book)
const N = window.PAGE_SVGS.length;

const params = new URLSearchParams(location.search);
if (params.get("bg")) document.body.style.background = params.get("bg");

function makeSvgNode(raw) {
  const div = document.createElement("div");
  div.innerHTML = raw;
  const svg = div.querySelector("svg");
  svg.removeAttribute("width");
  svg.removeAttribute("height");
  svg.setAttribute("preserveAspectRatio", "xMidYMid slice");
  return svg;
}

let pageFlip = null;

function buildBook() {
  const holder = document.getElementById("bookHolder");
  const book = document.getElementById("book");
  book.innerHTML = "";

  window.PAGE_SVGS.forEach((raw, i) => {
    const d = document.createElement("div");
    const isCover = i === 0 || i === N - 1;
    d.className = "sheet" + (isCover ? " --cover" : "");
    d.setAttribute("data-density", isCover ? "hard" : "soft");
    d.appendChild(makeSvgNode(raw));
    book.appendChild(d);
  });

  // fit spread (2 pages wide) into available space
  const availH = holder.clientHeight - 8;
  const availW = holder.clientWidth - 8;
  let pageH = availH;
  let pageW = Math.round(pageH * ASPECT);
  if (pageW * 2 > availW) {
    pageW = Math.floor(availW / 2);
    pageH = Math.round(pageW / ASPECT);
  }

  pageFlip = new St.PageFlip(book, {
    width: pageW,
    height: pageH,
    size: "fixed",
    showCover: true,
    maxShadowOpacity: 0.5,
    flippingTime: 700,
    usePortrait: true,
    mobileScrollSupport: false,
    drawShadow: true
  });
  pageFlip.loadFromHTML(book.querySelectorAll(":scope > .sheet"));

  const num = document.getElementById("num");
  const update = () => { num.textContent = (pageFlip.getCurrentPageIndex() + 1) + " / " + N; };
  pageFlip.on("flip", update);
  update();
}

document.getElementById("prev").onclick = () => pageFlip.flipPrev("top");
document.getElementById("next").onclick = () => pageFlip.flipNext("top");
document.addEventListener("keydown", e => {
  if (e.key === "ArrowLeft") pageFlip.flipPrev("top");
  if (e.key === "ArrowRight") pageFlip.flipNext("top");
});

let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const cur = pageFlip ? pageFlip.getCurrentPageIndex() : 0;
    if (pageFlip) { try { pageFlip.destroy(); } catch (e) {} pageFlip = null; }
    buildBook();
    if (cur > 0) pageFlip.turnToPage(cur);
  }, 250);
});

buildBook();
</script>
</body>
</html>
